<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYTimes Clone Book Review</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>NyTimes Clone Book Review</h1>
        <div class="search-bar" role="search">
            <input type="text" placeholder="Search books..." id="search-bar" aria-label="Search books" aria-autocomplete="list" aria-controls="suggestions-container" aria-expanded="false">
            <button id="search-button" aria-label="Search"><img src="https://res.cloudinary.com/doka2wyj0/image/upload/v1727447074/ja/icon/s6j1br9udh6bz4bhki8o.png" alt="search"></button>
            <div id="suggestions-container" class="suggestions" role="listbox"></div> <!-- Suggestions container -->
        </div>
    </header>

    <main role="main">
        <div id="reviews-container" aria-live="polite" role="list"></div>
        <div style="text-align:center; margin: 20px 0;">
            <button id="load-more" aria-label="Load more reviews">Load More</button>
        </div>
    </main>

    <footer>
        Copyright &copy; 2024 The New York Times Company. All Rights Reserved.
    </footer>
</body>
</html>
